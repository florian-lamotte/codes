
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Machine à écrire</title>

  <style>
    :root {
      color-scheme: light;
      --paper: #fffdf5;
      --ink: #292820;
      --accent: #a34b32;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: #e8e5dc;
      color: var(--ink);
      font-family: system-ui, sans-serif;
    }

    .machine {
      width: min(720px, 100%);
      padding: 32px;
      border: 1px solid #d4d0c4;
      border-radius: 12px;
      background: var(--paper);
      box-shadow: 0 12px 35px #00000012;
    }

    h1 {
      margin-top: 0;
      font-family: Georgia, serif;
      font-weight: normal;
    }

    #ecrire {
      min-height: 150px;
      padding: 22px;
      border-left: 3px solid var(--accent);
      background: #f6f2e7;
      font-family: "Courier New", monospace;
      font-size: 1.25rem;
      line-height: 1.8;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    #ecrire::after {
      content: "";
      display: inline-block;
      width: 2px;
      height: 1.1em;
      margin-left: 3px;
      vertical-align: text-bottom;
      background: var(--accent);
      animation: clignoter 0.8s steps(2) infinite;
    }

    #ecrire.termine::after,
    #ecrire.en-pause::after {
      animation-play-state: paused;
    }

    .commandes {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 24px;
    }

    button {
      padding: 10px 16px;
      border: 1px solid #ccc6b8;
      border-radius: 6px;
      background: white;
      color: var(--ink);
      font-size: 0.95rem;
      cursor: pointer;
    }

    button:hover {
      border-color: var(--accent);
    }

    button:focus-visible,
    input:focus-visible,
    textarea:focus-visible {
      outline: 3px solid #c27a64;
      outline-offset: 3px;
    }

    .principal {
      background: var(--accent);
      color: white;
      border-color: var(--accent);
    }

    .reglage {
      margin-top: 24px;
    }

    .reglage label {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 10px;
    }

    input[type="range"] {
      width: 100%;
      accent-color: var(--accent);
    }

    .source {
      display: block;
      margin-top: 24px;
      margin-bottom: 8px;
    }

    textarea {
      width: 100%;
      min-height: 90px;
      padding: 12px;
      resize: vertical;
      border: 1px solid #ccc6b8;
      border-radius: 6px;
      background: white;
      color: var(--ink);
      font: inherit;
    }

    #statut {
      min-height: 1.5em;
      margin-top: 16px;
      color: #696457;
      font-size: 0.9rem;
    }

    @keyframes clignoter {
      50% { opacity: 0; }
    }

    @media (max-width: 480px) {
      .machine {
        padding: 20px;
      }

      #ecrire {
        padding: 15px;
        font-size: 1.05rem;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      #ecrire::after {
        animation: none;
      }
    }
  </style>
</head>

<body>
  <main class="machine">
    <h1>Ma machine à écrire</h1>

    <div id="ecrire" aria-label="Texte en cours de saisie"
         aria-live="off"></div>

    <div class="commandes">
      <button id="demarrer" class="principal">▶ Démarrer</button>
      <button id="pause" disabled>Ⅱ Pause</button>
      <button id="recommencer">↻ Recommencer</button>
    </div>

    <div class="reglage">
      <label for="vitesse">
        <span>Vitesse de frappe</span>
        <strong><span id="delaiValeur">100</span> ms</strong>
      </label>
      <input id="vitesse" type="range"
             min="10" max="500" step="10" value="100">
      <small>Plus le délai est faible, plus la frappe est rapide.</small>
    </div>

    <label class="source" for="texteSource">
      Texte à écrire
    </label>
    <textarea id="texteSource">Lorem ipsum dolor sit amet, consectetur adipiscing elit. Nulla volutpat fermentum euismod. Nunc egestas sollicitudin mi vel fringilla. Nulla facilisi. Cras odio dui, accumsan id cursus sed, porta in mauris.
    </textarea>

    <p id="statut" role="status">Prêt à écrire.</p>
  </main>

  <script>
    const sortie = document.querySelector("#ecrire");
    const source = document.querySelector("#texteSource");
    const vitesse = document.querySelector("#vitesse");
    const valeurDelai = document.querySelector("#delaiValeur");
    const boutonDemarrer = document.querySelector("#demarrer");
    const boutonPause = document.querySelector("#pause");
    const boutonRecommencer = document.querySelector("#recommencer");
    const statut = document.querySelector("#statut");

    let caracteres = [];
    let position = 0;
    let minuteur = null;
    let enCours = false;
    let enPause = false;

    function afficherStatut(message) {
      statut.textContent = message;
    }

    function mettreAJourCommandes() {
      boutonPause.disabled = !enCours;
      boutonPause.textContent = enPause ? "▶ Reprendre" : "Ⅱ Pause";
      boutonDemarrer.disabled = enCours;
    }

    function afficherCaractere() {
      minuteur = null;

      if (!enCours || enPause) return;

      if (position >= caracteres.length) {
        terminer();
        return;
      }

      // textContent affiche le texte sans interpréter du HTML.
      sortie.textContent += caracteres[position];
      position++;

      if (position >= caracteres.length) {
        terminer();
        return;
      }

      minuteur = setTimeout(
        afficherCaractere,
        Number(vitesse.value)
      );
    }

    function terminer() {
      clearTimeout(minuteur);
      minuteur = null;
      enCours = false;
      enPause = false;

      sortie.classList.add("termine");
      sortie.classList.remove("en-pause");

      mettreAJourCommandes();
      afficherStatut("Texte terminé.");
    }

    function demarrer() {
      if (enCours || position >= caracteres.length) return;

      enCours = true;
      enPause = false;
      sortie.classList.remove("termine", "en-pause");

      mettreAJourCommandes();
      afficherStatut("Frappe en cours…");

      minuteur = setTimeout(afficherCaractere, 0);
    }

    function basculerPause() {
      if (!enCours) return;

      if (!enPause) {
        enPause = true;
        clearTimeout(minuteur);
        minuteur = null;
        sortie.classList.add("en-pause");
        afficherStatut("Frappe en pause.");
      } else {
        enPause = false;
        sortie.classList.remove("en-pause");
        afficherStatut("Frappe en cours…");
        minuteur = setTimeout(afficherCaractere, 0);
      }

      mettreAJourCommandes();
    }

    function recommencer() {
      clearTimeout(minuteur);
      minuteur = null;

      caracteres = Array.from(source.value);
      position = 0;
      enCours = false;
      enPause = false;

      sortie.textContent = "";
      sortie.classList.remove("termine", "en-pause");

      mettreAJourCommandes();
      afficherStatut("Prêt à écrire.");

      demarrer();
    }

    vitesse.addEventListener("input", () => {
      valeurDelai.textContent = vitesse.value;
    });

    boutonDemarrer.addEventListener("click", demarrer);
    boutonPause.addEventListener("click", basculerPause);
    boutonRecommencer.addEventListener("click", recommencer);

    // L'animation démarre automatiquement au chargement.
    recommencer();
  </script>
</body>
</html>
